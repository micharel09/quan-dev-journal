name: Journal checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: node scripts/prepare-local-env.mjs
      - run: docker compose -p quan-journal-ci -f docker-compose.journal.yaml up -d --wait
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run test:journal && npm run build
        working-directory: backend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:journal
        working-directory: frontend
      - if: always()
        run: docker compose -p quan-journal-ci -f docker-compose.journal.yaml down -v
